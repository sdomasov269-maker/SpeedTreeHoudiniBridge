name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ['3.11', '3.13']
        include:
          - os: ubuntu-22.04
            python: '3.7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
